<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>个人助手</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page" id="page">
    <!-- 全场景摄像头预览 -->
    <video class="camera" id="camera" playsinline webkit-playsinline muted></video>

    <!-- 顶部导航 -->
    <div class="nav">
      <div class="nav-tts" id="btnTts" title="语音播报开关">
        <span class="icon icon-volume-on" id="ttsIcon"></span>
      </div>
      <div class="nav-title" id="navTitle">个人助手</div>
    </div>

    <!-- 中部内容（非全场景） -->
    <div class="content" id="content">
      <div class="avatar-wrap" id="avatarWrap">
        <img class="avatar" src="images/basicprofile.jpeg" alt="avatar" />
      </div>
      <div class="answer-area" id="answerArea"></div>
    </div>

    <!-- 全场景问答浮层 -->
    <div class="scene-answer" id="sceneAnswer" style="display:none;">
      <div class="scene-q" id="sceneQ"></div>
      <div class="scene-a" id="sceneA"></div>
    </div>

    <!-- 状态提示 -->
    <div class="hint" id="hint">你可以开始说话</div>

    <!-- 底部按钮栏 -->
    <div class="bottom-bar">
      <div class="btn-row">
        <div class="circle-btn" id="btnCamera"><span class="icon icon-camera"></span></div>
        <div class="circle-btn" id="btnReset"><span class="icon icon-refresh"></span></div>
        <div class="circle-btn" id="btnMic"><span class="icon icon-mic"></span></div>
        <div class="circle-btn" id="btnClose"><span class="icon icon-close"></span></div>
      </div>
      <div class="footer-tip">由 AI 大模型生成，可能包含不准确的信息</div>
    </div>

    <!-- 录音遮罩 -->
    <div class="mask recording-mask" id="recordingMask" style="display:none;">
      <div class="recording-box">
        <span class="recording-wave">🎙️</span>
        <span class="recording-text">正在聆听，松手发送…</span>
      </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-mask" id="loadingMask" style="display:none;">
      <div class="loading-box"><span id="loadingText">思考中…</span></div>
    </div>
  </div>

  <!-- TTS 播放用 -->
  <audio id="ttsAudio" style="display:none;"></audio>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
